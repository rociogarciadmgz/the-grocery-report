<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cocina con Mamá Max</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a gingham tablecloth with one chunky, outlined game console card on top; chef on the left, cooking station on the right. Single committed "kitchen arcade" look. */
:root {
  --tomato: #E5432A;
  --tomato-dark: #B22E19;
  --mustard: #F7B928;
  --mint: #2FA97F;
  --sky: #3E9BD6;
  --cocoa: #3A2216;
  --butter: #FFF4D2;
  --paper: #FFFFFF;
  --wood: #D99A5B;
  --wood-dark: #B5733A;
  --steel: #2E2E36;
  --muted: #7A5A47;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --border: 4px solid var(--cocoa);
  --pop: 0 6px 0 var(--cocoa);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: var(--body);
  color: var(--cocoa);
  background-color: #FFFDF8;
  background-image:
    linear-gradient(90deg, rgba(229,67,42,.22) 50%, transparent 50%),
    linear-gradient(rgba(229,67,42,.22) 50%, transparent 50%);
  background-size: 48px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  font-size: 16px;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }

.console {
  max-width: 1120px;
  margin: 0 auto;
  background: var(--butter);
  border: var(--border);
  border-radius: 28px;
  box-shadow: 0 10px 0 var(--cocoa);
  overflow: hidden;
}
.marquee {
  background: var(--tomato);
  color: var(--paper);
  border-bottom: var(--border);
  padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.marquee h1 {
  margin: 0;
  font-family: var(--display); font-weight: 800;
  font-size: clamp(1.5rem, 3.4vw, 2.2rem); line-height: 1;
  letter-spacing: .01em;
  text-shadow: 3px 3px 0 var(--cocoa);
}
.marquee .tools { display: flex; gap: 8px; }
.chip-btn {
  background: var(--paper); border: 3px solid var(--cocoa); border-radius: 999px;
  padding: 4px 14px; font-weight: 800; font-size: .9rem; box-shadow: 0 3px 0 var(--cocoa); color: var(--cocoa);
}
.chip-btn:active { transform: translateY(3px); box-shadow: none; }

.screen { padding: 24px; }
.big-btn {
  font-family: var(--display); font-weight: 800; font-size: 1.4rem;
  background: var(--mustard); border: var(--border); border-radius: 18px;
  padding: 10px 28px; box-shadow: var(--pop); transition: transform .08s;
}
.big-btn:hover { transform: translateY(-2px); }
.big-btn:active { transform: translateY(6px); box-shadow: none; }
.big-btn.green { background: var(--mint); color: var(--paper); text-shadow: 2px 2px 0 var(--cocoa); }
.big-btn.red { background: var(--tomato); color: var(--paper); text-shadow: 2px 2px 0 var(--cocoa); }

/* ---------- Intro ---------- */
.intro { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 28px; align-items: start; }
.intro h2 { font-family: var(--display); font-size: clamp(1.6rem, 3vw, 2.3rem); margin: 0 0 6px; line-height: 1.1; text-wrap: balance; }
.intro p { margin: 0 0 14px; max-width: 62ch; line-height: 1.5; }
.recipe-card {
  background: var(--paper); border: var(--border); border-radius: 18px; padding: 16px 18px;
  display: grid; gap: 10px; margin-block: 14px;
}
.recipe-card h3 { margin: 0; font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; letter-spacing: .06em; color: var(--tomato-dark); }
.steps-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
